{% extends 'base.html' %}

{% block title %}Password Reset Complete - Core Synch Solutions{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <div style="width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                <i class="bi bi-check-circle-fill" style="font-size: 1.8rem; color: white;"></i>
            </div>
            <h4 class="fw-bold" style="color: #1e293b;">Password Reset Complete</h4>
            <p class="text-muted">Your password has been set successfully</p>
        </div>

        <div class="card border-0 shadow-sm" style="border-radius: 16px;">
            <div class="card-body p-4 text-center">
                <p>Your password has been set. You may now log in with your new password.</p>
                <div class="text-center mt-4">
                    <a href="{% url 'login' %}" class="btn btn-lg" 
                           style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 10px; padding: 0.75rem 2rem; font-weight: 600; color: white;">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

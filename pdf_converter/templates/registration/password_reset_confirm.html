{% extends 'base.html' %}

{% block title %}Enter New Password - Core Synch Solutions{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <div style="width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                <i class="bi bi-key-fill" style="font-size: 1.8rem; color: white;"></i>
            </div>
            <h4 class="fw-bold" style="color: #1e293b;">Set New Password</h4>
            <p class="text-muted">Enter your new password below</p>
        </div>

        <div class="card border-0 shadow-sm" style="border-radius: 16px;">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-lg w-100 mt-2" 
                            style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 10px; padding: 0.75rem; font-weight: 600; color: white;">
                        <i class="bi bi-check-lg me-2"></i> Change Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
